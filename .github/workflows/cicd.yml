name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - post_production
  pull_request:

jobs:

  # =========================================================
  # BUILD + TEST
  # =========================================================
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hradmin
          POSTGRES_PASSWORD: secret123
          POSTGRES_DB: hrdb
        ports:
          - 6544:5432
        options: >-
          --health-cmd="pg_isready -U hradmin -d hrdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:6
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          cat <<EOF > .env
          POSTGRES_USER=hradmin
          POSTGRES_PASSWORD=secret123
          POSTGRES_DB=hrdb
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432

          MONGO_USER=root
          MONGO_PASSWORD=example
          MONGO_DBNAME=hrmongo
          MONGO_HOST=mongo
          MONGO_PORT=27017

          FLASK_ENV=development
          FLASK_APP=app.py
          FLASK_RUN_HOST=0.0.0.0
          FLASK_RUN_PORT=5000
          PORT=5000

          OTP_EXPIRY_MINUTES=5

          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}

          SECRET_KEY=ci-secret
          EOF

      - name: Check Docker Compose Version
        run: docker compose version

      - name: Build and Start Services
        run: |
          docker compose -f docker-compose.yml up --build -d

          echo "⏳ Waiting for containers to initialize..."
          sleep 25

      - name: Show Running Containers
        run: docker ps -a

      - name: Check PostgreSQL Health
        run: |
          docker exec hr_postgres pg_isready -U hradmin -d hrdb || (echo "❌ PostgreSQL failed" && exit 1)

      - name: Check MongoDB Health
        run: |
          docker exec hr_mongo mongosh -u root -p example --eval "db.stats()" || (echo "❌ MongoDB failed" && exit 1)

      - name: Debug Flask Container Logs
        run: |
          docker logs hr_flask_web || true

      - name: Check Flask Web Health
        run: |
          for i in {1..15}; do

            if curl -s http://localhost:5000/ > /dev/null; then
              echo "✅ Flask app is healthy"
              exit 0
            fi

            echo "⏳ Retrying Flask app... attempt $i"
            sleep 10

          done

          echo "❌ Flask app failed to respond"
          exit 1

      - name: Install Dev Dependencies
        run: |
          docker cp requirements-dev.txt hr_flask_web:/tmp/requirements-dev.txt

          docker exec hr_flask_web \
            pip install -r /tmp/requirements-dev.txt

      - name: Run Pytest
        run: |
          docker cp . hr_flask_web:/tmp/app

          docker exec hr_flask_web \
            pytest /tmp/app/tests || (echo "❌ Tests failed" && exit 1)



  # =========================================================
  # RAILWAY PRECHECK
  # =========================================================
  railway-precheck:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Railway CLI
        run: |
          curl -sSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Verify Railway CLI
        run: railway --version

      - name: Validate Railway Authentication
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway whoami

      - name: Link Railway Project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: railway link $RAILWAY_PROJECT_ID

      - name: Verify Railway Project Access
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway status

      - name: Verify Required Files
        run: |
          test -f Dockerfile || (echo "❌ Dockerfile missing" && exit 1)

          test -f docker-compose.yml || \
          (echo "❌ docker-compose.yml missing" && exit 1)

      - name: Validate Docker Build
        run: |
          docker build -t hr-test .

      - name: Validate Railway Deployment Readiness
        run: |
          echo "✅ Railway deployment precheck passed"



  # =========================================================
  # DEPLOY
  # =========================================================
  deploy:
    runs-on: ubuntu-latest
    needs: railway-precheck

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Railway CLI
        run: |
          curl -sSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Link Railway Project
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: railway link $RAILWAY_PROJECT_ID

      # =====================================================
      # MAIN BRANCH → PRODUCTION
      # =====================================================
      - name: Deploy to Railway Production
        if: github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service web \
            --environment production

      # =====================================================
      # POST_PRODUCTION BRANCH
      # =====================================================
      - name: Deploy to Railway Post Production
        if: github.ref == 'refs/heads/post_production'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service web \
            --environment production

      # =====================================================
      # VERIFY DEPLOYMENT
      # =====================================================
      - name: Deployment Finished
        run: |
          echo "✅ Railway deployment completed successfully"