name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - post_production
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hradmin
          POSTGRES_PASSWORD: secret123
          POSTGRES_DB: hrdb
        ports:
          - 6543:5432
        options: >-
          --health-cmd="pg_isready -U hradmin -d hrdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:6
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build and Start Containers
        run: |
          docker compose -f docker-compose.yml up --build -d
          echo "Waiting for services to stabilize..."
          sleep 20

      - name: Check PostgreSQL
        run: |
          docker exec hr_postgres pg_isready -U hradmin -d hrdb || (echo "❌ PostgreSQL failed" && exit 1)

      - name: Check MongoDB
        run: |
          docker exec hr_mongo mongosh -u root -p example --eval "db.runCommand({ ping: 1 })" || (echo "❌ MongoDB failed" && exit 1)

      - name: Check Web App
        run: |
          for i in {1..5}; do
            if curl -s http://localhost:5000/ > /dev/null; then
              echo "✅ Web app is healthy"
              exit 0
            fi
            echo "Retrying web app health check ($i/5)..."
            sleep 5
          done
          echo "❌ Web app failed to respond" && exit 1

      - name: Run Tests
        run: |
          docker exec hr_flask_web pytest || (echo "❌ Tests failed" && exit 1)

    deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy to Railway (Production)
        if: github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: railway up --service web --environment production

      - name: Deploy to Railway (Post-Production)
        if: github.ref == 'refs/heads/post_production'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: railway up --service web --environment post_production
