name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - post_production
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hradmin
          POSTGRES_PASSWORD: secret123
          POSTGRES_DB: hrdb
        ports:
          - 6544:5432
        options: >-
          --health-cmd="pg_isready -U hradmin -d hrdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongo:
        image: mongo:6
        ports:
          - 27018:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          cat <<EOF > .env
          POSTGRES_USER=hradmin
          POSTGRES_PASSWORD=secret123
          POSTGRES_DB=hrdb
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432

          MONGO_USER=root
          MONGO_PASSWORD=example
          MONGO_DBNAME=hrmongo
          MONGO_HOST=mongo
          MONGO_PORT=27017

          FLASK_ENV=development
          FLASK_APP=app.py
          FLASK_RUN_HOST=0.0.0.0
          FLASK_RUN_PORT=5000
          PORT=5000

          OTP_EXPIRY_MINUTES=5
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}
          SECRET_KEY=ci-secret
          EOF

      - name: Check Docker Compose version
        run: docker compose version

      - name: Build and Start Services
        run: |
          docker compose -f docker-compose.yml up --build -d
          echo "⏳ Waiting for services..."
          sleep 20

      - name: Check PostgreSQL
        run: |
          docker exec hr_postgres pg_isready -U hradmin -d hrdb || (echo "❌ PostgreSQL failed" && exit 1)

      - name: Check MongoDB
        run: |
          docker exec hr_mongo mongosh -u root -p example --eval "db.stats()" || (echo "❌ MongoDB failed" && exit 1)
      - name: Debug Web Container
        run: |
          docker ps -a
          docker logs hr_flask_web || true

      - name: Check Web App Health
        run: |
          for i in {1..15}; do
            if curl -s http://localhost:5000/ > /dev/null; then
              echo "✅ Web app is healthy"
              exit 0
            fi
            echo "Retrying web service... attempt $i"
            sleep 10
          done
          echo "❌ Web app failed to respond" && exit 1

      - name: Install dev dependencies (CI only)
        run: |
          # Copy requirements-dev.txt into container temporarily
          docker cp requirements-dev.txt hr_flask_web:/tmp/requirements-dev.txt
          # Install dev dependencies
          docker exec hr_flask_web pip install -r /tmp/requirements-dev.txt

      - name: Run Tests
        run: |
          # Copy the whole repo into container
          docker cp . hr_flask_web:/tmp/app
          # Run pytest on the tests folder
          docker exec hr_flask_web pytest /tmp/app/tests || (echo "❌ Web app tests failed" && exit 1)


  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy to Railway (Production)
        if: github.ref == 'refs/heads/main'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: railway up --service web --environment production

      - name: Deploy to Railway (Post-Production)
        if: github.ref == 'refs/heads/post_production'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: railway up --service web --environment post_production
